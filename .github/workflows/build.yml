# ============================================================================
# .github/workflows/build.yml
# GitHub Actions 构建脚本：把代码推送到 main 分支时，云端自动编译出 debug APK。
# 也可以在网页上手动点击运行（workflow_dispatch）。
# ============================================================================

name: Build Debug APK

on:
  # 每次推送到 main 分支就自动构建
  push:
    branches: [ "main" ]

  # 允许在 GitHub 网页上手动点击运行
  workflow_dispatch:

# 构建过程只需要读取代码，不需要任何写权限
permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    # 用 GitHub 提供的免费 Ubuntu 服务器
    runs-on: ubuntu-latest

    steps:
      # 1. 把仓库里的代码下载到构建服务器
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 JDK 17（AGP 8.11 官方支持的最低版本，最稳）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK 命令行工具
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. 自动接受 Android SDK 许可证（不接受就没法下载 SDK 组件）
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 5. 下载 Android 16（API 36）的编译平台
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      # 6. 告诉 Gradle 去哪里找 Android SDK（等价于本机的 local.properties）
      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      # 7. 安装 Gradle 8.13（本项目不使用 gradle-wrapper.jar，直接用 gradle 命令）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 8. 开始构建 debug APK
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # 9. 把编译好的 APK 上传，方便下载
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
