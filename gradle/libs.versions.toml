# ============================================================================
# gradle/libs.versions.toml
# 版本目录：整个项目用到的插件和依赖库的版本，全部集中在这里。
# 想升级某个库，只改这里的数字即可。
# ============================================================================

[versions]
# Android Gradle Plugin：负责“把 Android 项目编译成 APK”
agp = "8.11.1"
# Kotlin 语言与 Compose 编译器插件的版本（两者必须一致）
kotlin = "2.1.21"

# Jetpack / AndroidX 依赖
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
# Compose BOM：一个版本号统管所有 Compose 库的版本，保证它们彼此兼容
composeBom = "2024.12.01"
# DataStore：私有目录里的键值对存储（工作区列表用）
datastorePreferences = "1.2.1"

# 说明：别名故意写成“每个名字两段、且没有任何名字是另一个名字的前缀”，
# 这样 Gradle 生成的 libs.xxx.yyy 访问器不会互相冲突。
[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose：版本由 BOM 决定，所以下面这些不写 version
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
# ui-tooling-preview：给 Android Studio 的 Preview 用
compose-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# ui-tooling：预览工具的完整版，只在 debug 构建里引入
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material 图标（只用最基础的图标集，避免 APK 变大）
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# 数据存储：工作区列表
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
